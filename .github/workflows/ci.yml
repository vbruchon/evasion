name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evasion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evasion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evasion_test

      BETTER_AUTH_SECRET: ci-only-secret-change-me-1234567890
      BETTER_AUTH_URL: http://127.0.0.1:3100

      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret

      ADMIN_EMAILS: ci-admin@example.com

      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-token

      RESEND_API_KEY: re_ci_dummy
      CONTACT_FROM_EMAIL: ci@example.com
      CONTACT_TO_EMAIL: ci@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm security:audit

      - name: Create test environment
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env.test

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Prepare test database
        run: pnpm test:db:reset

      - name: Run quality checks
        run: pnpm can-commit

      - name: Seed build database
        run: pnpm db:seed

      - name: Build application
        run: pnpm build

  e2e:
    name: Critical E2E
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evasion_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evasion_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create E2E environment
        run: |
          cat > .env.e2e <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/evasion_e2e
              
          NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3100
              
          BETTER_AUTH_SECRET=e2e-only-secret-change-me-1234567890
          BETTER_AUTH_URL=http://127.0.0.1:3100
          GOOGLE_CLIENT_ID=e2e-google-client-id
          GOOGLE_CLIENT_SECRET=e2e-google-client-secret
          ADMIN_EMAILS=e2e-admin@example.com
              
          UPLOADTHING_TOKEN=
              
          RESEND_API_KEY=re_e2e_dummy
          CONTACT_FROM_EMAIL=e2e@example.com
          CONTACT_TO_EMAIL=e2e@example.com
              
          UPSTASH_REDIS_REST_URL=https://example.invalid
          UPSTASH_REDIS_REST_TOKEN=e2e-token
              
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          EOF

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run critical E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
